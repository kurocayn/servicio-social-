<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faro de Conexión - Red de Apoyo CDMX</title>
    <style>
        :root {
            --primary-color: #2C3E50; /* Color oscuro del faro */
            --secondary-color: #5856D6;
            --bg-color: #F4F4F9;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --danger-color: #FF3B30;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }
        .lema-header { font-size: 14px; color: #666; font-style: italic; font-weight: normal;}
        
        #btn-panico {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #btn-panico:hover { background-color: #cc2e26; }
        
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        h1, .subtitle { text-align: center; }
        .subtitle { color: #666; margin-bottom: 40px; line-height: 1.6;}
        .lema-destacado { color: var(--secondary-color); font-weight: bold; font-size: 18px;}
        .badge-zona { background-color: #FF9500; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; vertical-align: middle; margin-left: 10px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }
        
        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border-top: 5px solid var(--secondary-color);
            transition: all 0.3s ease;
            height: 220px;
            overflow: hidden;
            position: relative;
        }
        .card:hover {
            height: 480px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transform: translateY(-5px);
        }
        .card h2 { margin-top: 0; font-size: 20px; color: var(--primary-color); }
        .tag {
            display: inline-block; background-color: #e0e0f8; color: var(--secondary-color);
            padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 10px;
        }
        
        .extra-info {
            opacity: 0;
            transition: opacity 0.4s ease;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            font-size: 14px;
        }
        .card:hover .extra-info { opacity: 1; }
        .extra-info strong { color: var(--secondary-color); }
        .extra-info ul { margin: 5px 0 15px 0; padding-left: 20px; }
        
        .btn-visitar {
            display: block; text-align: center; background-color: var(--secondary-color);
            color: white; text-decoration: none; padding: 10px; border-radius: 8px;
            font-weight: bold; position: absolute; bottom: 25px; width: calc(100% - 50px);
        }
        .error-msg { text-align: center; color: var(--danger-color); font-weight: bold; grid-column: 1 / -1; padding: 20px; border: 2px dashed var(--danger-color); border-radius: 8px;}
    </style>
</head>
<body>

    <header>
        <div class="logo">
            🗼 Faro de Conexión 
            <span class="lema-header">"Conectando ayuda, protegiendo identidades"</span>
        </div>
        <button id="btn-panico" onclick="salidaRapida()">SALIDA RÁPIDA (Esc)</button>
    </header>

    <div class="container">
        <h1>Directorio de Apoyo <span class="badge-zona">Fase Piloto: CDMX</span></h1>
        <p class="subtitle">
            <span class="lema-destacado">"Conectando ayuda, protegiendo identidades"</span><br>
            Pasa el cursor sobre cada institución para descubrir más detalles sobre su historia y ubicación.
        </p>
        
        <div class="grid" id="directorio-contenedor">
            <!-- Las tarjetas se insertarán aquí dinámicamente desde datos.json -->
        </div>
    </div>

    <script>
        async function cargarDirectorio() {
            const contenedor = document.getElementById('directorio-contenedor');
            
            try {
                // Hacemos el llamado (fetch) al archivo JSON separado
                const response = await fetch('datos.json');
                if (!response.ok) {
                    throw new Error('Error al cargar el archivo JSON.');
                }
                const instituciones = await response.json();
                
                instituciones.forEach(inst => {
                    let listaAyuda = inst.tipo_ayuda.map(item => `<li>${item}</li>`).join('');
                    const tarjeta = `
                        <div class="card">
                            <span class="tag">${inst.categoria}</span>
                            <h2>${inst.nombre}</h2>
                            <p>${inst.descripcion}</p>
                            <p class="contact-info">📞 ${inst.telefono}</p>
                            
                            <div class="extra-info">
                                <p><strong>Ubicación:</strong> ${inst.ubicacion}</p>
                                <p><strong>Historia:</strong> ${inst.historia}</p>
                                <p><strong>¿Cómo te ayudan?:</strong></p>
                                <ul>${listaAyuda}</ul>
                            </div>
                            
                            <a href="${inst.sitio_web}" target="_blank" class="btn-visitar">Ir al Sitio Web Oficial</a>
                        </div>
                    `;
                    contenedor.innerHTML += tarjeta;
                });
            } catch (error) {
                // Mensaje de error si se abre el HTML directamente sin Live Server
                contenedor.innerHTML = `
                <div class="error-msg">
                    ⚠️ Error de conexión: No se pudo cargar 'datos.json'.<br><br>
                    Para que la página web pueda leer el archivo JSON separado de manera local, 
                    debes abrir el archivo 'index.html' usando la extensión <strong>Live Server</strong> en VS Code. 
                    (De lo contrario, el navegador bloqueará la lectura del archivo por políticas de seguridad CORS).
                </div>`;
                console.error('Error:', error);
            }
        }

        function salidaRapida() {
            window.location.replace("https://www.google.com");
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") { salidaRapida(); }
        });

        window.onload = cargarDirectorio;
    </script>
</body>
</html>
